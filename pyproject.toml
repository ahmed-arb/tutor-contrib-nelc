# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-contrib-nelc"
description = "nelc plugin for Tutor"
authors = [
  { name = "Ahmed Khalid"},
  { email = "ahmed.khalid@arbisoft.com" },
]
license = { text = "AGPL-3.0-only" }

readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

]
dependencies = [
    "tutor>=21.0.0,<22.0.0",
]

# These fields will be set by hatch_build.py
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "tutor[dev]>=21.0.0,<22.0.0",
    "ruff",
]

[tool.hatch.version]
path = "tutornelc/__about__.py"

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Documentation = "https://github.com/ahmed-arb/tutor-contrib-nelc#readme"
Issues = "https://github.com/ahmed-arb/tutor-contrib-nelc/issues"
Source = "https://github.com/ahmed-arb/tutor-contrib-nelc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutornelc"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/tutornelc"]
exclude = ["tests*"]

[project.entry-points."tutor.plugin.v1"]
nelc = "tutornelc.plugin"
