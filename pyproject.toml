[project]
name = "tutor-contrib-nelc"
description = "Partner certification plugin for Open edX / Tutor"
authors = [
  { name = "Ahmed Khalid" },
  { email = "ahmed.khalid@arbisoft.com" },
]
license = { text = "AGPL-3.0-only" }
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">= 3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["tutor>=22.0.0,<23.0.0"]
dynamic = ["version"]

[tool.hatch.version]
path = "tutornelc/__about__.py"

[project.urls]
Source = "https://github.com/ahmed-arb/tutor-contrib-nelc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutornelc"]

[tool.hatch.build.targets.sdist]
strict-naming = false
include = [
  "/tutornelc",
  "LICENSE.txt",
]
exclude = ["tests*"]

# This is what makes `tutor plugins enable nelc` work. Tutor discovers plugins
# through this entry point group; there is no registry and no config file.
[project.entry-points."tutor.plugin.v1"]
nelc = "tutornelc.plugin"
